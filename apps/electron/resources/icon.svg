<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    Xwom App Icon - macOS Big Sur+ style
    - Canvas: 1024x1024
    - Rounded rect: 824x824 centered (margin 100px)
    - Corner radius: 185px (~22.5%)
  -->

  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#4a0e78"/>
    </linearGradient>
    <linearGradient id="x-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00bbf9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(100, 100) scale(1.03)">
    <!-- macOS style rounded background -->
    <rect width="800" height="800" rx="180" ry="180" fill="url(#bg-gradient)"/>

    <!-- Neural network dots -->
    <g opacity="0.3">
      <circle cx="150" cy="150" r="4" fill="#00f5d4"/>
      <circle cx="650" cy="120" r="3" fill="#00f5d4"/>
      <circle cx="180" cy="650" r="3.5" fill="#00f5d4"/>
      <circle cx="620" cy="680" r="4" fill="#00f5d4"/>
      <circle cx="100" cy="400" r="2.5" fill="#00f5d4"/>
      <circle cx="700" cy="400" r="3" fill="#00f5d4"/>
      <line x1="150" y1="150" x2="280" y2="260" stroke="#00f5d4" stroke-width="1" opacity="0.5"/>
      <line x1="650" y1="120" x2="520" y2="260" stroke="#00f5d4" stroke-width="1" opacity="0.5"/>
      <line x1="180" y1="650" x2="280" y2="540" stroke="#00f5d4" stroke-width="1" opacity="0.5"/>
      <line x1="620" y1="680" x2="520" y2="540" stroke="#00f5d4" stroke-width="1" opacity="0.5"/>
    </g>

    <!-- Stylized X letter -->
    <g filter="url(#glow)" transform="translate(400, 400)">
      <!-- X shape - two crossing strokes -->
      <path d="M-150,-160 L-80,-160 L0,-30 L80,-160 L150,-160 L40,0 L150,160 L80,160 L0,30 L-80,160 L-150,160 L-40,0 Z"
            fill="url(#x-gradient)" opacity="0.95"/>
    </g>
  </g>
</svg>
